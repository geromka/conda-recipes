{% set name = "log4cxx" %}
{% set version = "1.7.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  git_rev: v1.7.0-RC2
  git_url: https://github.com/apache/logging-log4cxx.git
  #url: http://archive.apache.org/dist/logging/{{ name }}/{{ version }}/apache-{{ name }}-{{ version }}.tar.gz
  #sha256: b943ff170393e4ce381ab4c4914396127bf4d44fb8bd1f0e5ef8453f3c4d364c
  patches:
    - patches/fix_fmt_v12.patch

build:
  number: 0

requirements:
  build:
    - {{ compiler('cxx') }}
    - {{ compiler('c') }}
    - cmake
    - make  # [unix]
  host:
    - apr
  run:
    - apr
    - libaprutil
    - libapr

about:
  home: https://logging.apache.org/log4cxx
  license: Apache-2.0
  summary: "Apache Log4cxx is a C++ port of Apache Log4j"
  doc_url: https://logging.apache.org/log4cxx

extra:
  recipe-maintainers:
    - geromka